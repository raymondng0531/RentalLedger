name: rental_ledger
description: A modern mobile application for shared-house Central Account management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  # joinHouse is a callable: a membership is an authorization fact, so it is
  # written by the trusted server, never by the client (see firestore.rules).
  cloud_functions: ^5.6.0

  # Utilities
  intl: ^0.20.2
  # Local, device-scoped preferences (appearance, and later language). On Web
  # this is browser localStorage — no Firestore, no rules, no backend. Kept
  # separate from Isar, which is still a placeholder for V1.2 offline support.
  shared_preferences: ^2.3.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  # XFile is used directly by the data layer to read picked image bytes on web.
  cross_file: ^0.3.5
  # package:web powers the web-only <img> element used to display stored
  # receipts (Flutter's Image.network fetch is blocked by Storage bucket CORS).
  web: ^1.1.1
  share_plus: ^10.1.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.2
  flutter_image_compress: ^2.4.0
  google_mlkit_text_recognition: ^0.14.0

  # Charts
  fl_chart: ^0.70.2

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.2

  # Material Design 3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

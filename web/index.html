<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    Use the real device viewport instead of the browser's virtual ~980px
    viewport on mobile (iPhone/iPad Safari, Android Chrome). Without this the
    Flutter canvas renders at the virtual width and is scaled down — too small
    to read or tap. Kept to width/initial-scale on purpose: `viewport-fit=cover`
    would extend the layout into the iOS notch/status-bar area and change the
    app's appearance without explicit safe-area handling.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Rental Ledger - household finance management.">

  <!-- Google Sign-In web client ID -->
  <meta name="google-signin-client_id"
        content="1036946500500-47qm7c7qncmpb5032417vu2hv3h0m7rn.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rental Ledger">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rental Ledger</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
